<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新年のごあいさつ｜情報誌くれよん 清須・津島版</title>
  <meta name="description" content="地元の企業・お店から、新年のごあいさつ。情報誌くれよん 清須・津島版 1月号連動企画">
  <meta name="robots" content="noindex, nofollow"><!-- 確認用（検索に出さない） -->
  <meta name="theme-color" content="#B7282E">
  <!-- LINE・SNSで送ったときの表示（会社ページも共通の画像と文になります） -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="情報誌くれよん">
  <meta property="og:title" content="新年のごあいさつ｜地元の企業・お店から">
  <meta property="og:description" content="情報誌くれよん 清須・津島版 1月号連動企画">
  <meta property="og:image" content="https://kcreate-kureyon202701.github.io/kureyon-nenga-2027/kiyosu-tsushima-test/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://docs.google.com" crossorigin>
  <link rel="preconnect" href="https://drive.google.com" crossorigin>
  <link rel="stylesheet" href="style.css?v=20261125b">
  <script>document.documentElement.classList.add('js');</script>
  <script src="sheet-config.js?v=20261125b"></script>
  <script src="data.js?v=20261125b"></script>
  <script src="mizuhiki.js?v=20261125b"></script>
  <script src="common.js?v=20261125b"></script>
</head>
<body class="antialiased min-h-screen flex flex-col">

  <header class="site-head">
    <div class="obi"></div>
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="back-link">‹ 一覧へ戻る</a>
      <div id="headTitle" class="font-mincho text-sm font-bold text-kin-dark hidden md:block tracking-widest"></div>
    </div>
  </header>

  <main id="page" class="max-w-5xl w-full mx-auto px-4 py-10 md:py-14 flex-grow">
    <!-- 読み込み中（すぐ出る。真っ白にしない） -->
    <div class="loader" role="status" aria-live="polite">
      <svg class="loader-knot" viewBox="-24 -24 48 48" aria-hidden="true"><g fill="#D8434A" stroke="#9E1F25" stroke-width="1"><circle cx="0" cy="-10.5" r="9.5"/><circle cx="10" cy="-3.2" r="9.5"/><circle cx="6.2" cy="8.5" r="9.5"/><circle cx="-6.2" cy="8.5" r="9.5"/><circle cx="-10" cy="-3.2" r="9.5"/></g><circle r="5" fill="#F3D27A"/></svg>
      <p>読み込み中…</p>
    </div>
  </main>

  <footer id="foot" hidden class="seigaiha-red text-white border-t-4 border-kin"></footer>

  <script>
  (function () {
    if (IS_PREVIEW) document.querySelectorAll('a[href="index.html"]').forEach(function (a) { a.href = 'index.html?preview=1'; });
    var page = document.getElementById('page');
    var id = new URLSearchParams(location.search).get('id');

    // 見出し（両わきに金の線と梅）。狭い画面では線を短くして1行に収める
    function heading(text) {
      return '<h2 class="ume-heading font-mincho font-extrabold"><span class="line"></span>' + umeIcon('ume') + '<span class="ume-text">' + esc(text) + '</span>' + umeIcon('ume') + '<span class="line r"></span></h2>';
    }
    function tableBlock(title, rows) {
      if (!rows || !rows.length) return '';
      return '<section><h2 class="sub-heading font-mincho font-extrabold">' + esc(title) + '</h2>' +
        '<div class="tbl-box"><table class="w-full text-base"><tbody>' + tableHtml(rows) + '</tbody></table></div></section>';
    }
    function freeBlock(title, text) {
      if (!text) return '';
      return '<section><h2 class="sub-heading font-mincho font-extrabold">' + esc(title || 'お知らせ') + '</h2>' +
        '<div class="bg-white kin-frame rounded-md p-6 text-base leading-loose whitespace-pre-line">' + esc(text) + '</div></section>';
    }
    function btn(href, label, cls, icon) {
      return '<a href="' + esc(href) + '" target="_blank" rel="noopener" class="big-btn ' + cls + '">' + (icon || '') + '<span>' + esc(label) + '</span></a>';
    }
    var IG_ICON = '<svg class="w-6 h-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>';
    var TEL_ICON = '<svg class="w-6 h-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>';
    var MAP_ICON = '<svg class="w-6 h-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

    function render() {
      var S = window.SITE || {};
      var foot = document.getElementById('foot'); foot.innerHTML = footerHtml(); foot.hidden = false;
      document.getElementById('headTitle').textContent = (S.title || '') + '　' + (S.year || '');
      var list = window.COMPANIES || [];
      var idx = -1;
      list.forEach(function (x, i) { if (String(x.id) === id) idx = i; });
      var c = list[idx];

      if (!c) {
        page.innerHTML = '<section class="bg-white kin-frame rounded-md p-10 text-center">' +
          '<p class="font-bold mb-4">お探しのページが見つかりませんでした。</p>' +
          '<a href="index.html' + (IS_PREVIEW ? '?preview=1' : '') + '" class="inline-block bg-shu text-white font-bold px-6 py-3 rounded-full">一覧へ戻る</a></section>';
        return;
      }
      document.title = c.companyName + '｜新年のごあいさつ｜情報誌くれよん';

      // 電話・地図（シートに値がある会社だけ）
      var addr = '';
      (c.overview || []).forEach(function (r) { if (/所在地|住所/.test(r[0]) && r[1]) addr = r[1]; });
      var tel = (c.tel || '').trim();
      var quick = (tel ? '<a class="quick-btn" href="tel:' + esc(tel.replace(/[^0-9+]/g, '')) + '">' + TEL_ICON + '<span><b>電話する</b><small>' + esc(tel) + '</small></span></a>' : '') +
        (addr ? '<a class="quick-btn" href="https://www.google.com/maps/search/?api=1&amp;query=' + encodeURIComponent(addr.replace(/\n/g, ' ')) + '" target="_blank" rel="noopener">' + MAP_ICON + '<span><b>地図で見る</b><small>Googleマップ</small></span></a>' : '');

      // 新春のお知らせ
      var news = (c.news || []).map(function (n) {
        return '<div class="bg-white kin-frame rounded-md p-6 news-card">' +
          '<h3 class="font-mincho font-extrabold text-lg mb-2 flex items-start gap-2"><span class="text-shu" aria-hidden="true">◆</span><span>' + esc(n.title) + '</span></h3>' +
          '<p class="text-base text-gray-700 leading-relaxed whitespace-pre-line">' + esc(n.text) + '</p></div>';
      }).join('');

      var extra = c.extraType === 'free' ? freeBlock(c.freeTitle, c.freeText) : tableBlock('求人情報', c.recruit);
      var tables = extra + tableBlock('会社情報', c.overview);

      var btns = (c.url ? btn(c.url, S.linkButton || 'ホームページを見る', 'bg-shu') : '') +
        (c.instagram ? btn(c.instagram, 'Instagramを見る', 'btn-insta', IG_ICON) : '') +
        (c.recruitUrl ? btn(c.recruitUrl, '求人情報はこちら', 'btn-recruit') : '');

      // あいさつ文：一行ずつ（パソコンは縦書きで筆で書くように、スマホは一段落ずつ）
      var lines = String(c.message || '').split('\n').map(function (l, i) {
        return '<span class="ln" style="--i:' + i + '">' + (l.trim() ? esc(l) : '　') + '</span>';
      }).join('');
      var signText = esc(c.companyName) + ((c.staffRole || c.staffName) ? '<br>' + esc(c.staffRole) + '　' + esc(c.staffName) : '');
      // パソコンでは、縦書きの横の空いたところに写真と署名を置く
      var sidePhoto = c.staffPhoto
        ? '<img src="' + esc(String(c.staffPhoto).replace(/&sz=w\d+$/, '&sz=w400')) + '" alt="' + esc((c.staffRole || '') + ' ' + (c.staffName || '')) + '" width="176" height="176" loading="lazy" class="greet-face">'
        : (c.photo ? '<div class="greet-photo">' + photoHtml(c.photo, c.companyName, '', { sizes: '260px' }) + '</div>' : '');

      var nav = '';
      if (list.length > 1) {
        var prev = list[(idx - 1 + list.length) % list.length], next = list[(idx + 1) % list.length];
        nav = '<nav class="pn" aria-label="ほかの会社のごあいさつ">' +
          '<a class="pn-a" href="company.html?id=' + encodeURIComponent(prev.id) + pv() + '"><small>‹ 前の会社</small><span>' + esc(prev.companyName) + '</span></a>' +
          '<a class="pn-a pn-next" href="company.html?id=' + encodeURIComponent(next.id) + pv() + '"><small>次の会社 ›</small><span>' + esc(next.companyName) + '</span></a>' +
          '</nav>';
      }

      page.innerHTML =
        '<div class="-mx-4 md:mx-0 mb-6">' + noshiHtml('lg') + '</div>' +
        '<section class="text-center mb-8">' +
          (c.category ? '<div class="mb-3"><span class="hanko">' + esc(c.category) + '</span></div>' : '') +
          '<h1 class="font-mincho font-extrabold text-3xl md:text-5xl tracking-wider leading-tight mb-3">' + esc(c.companyName) + '</h1>' +
          (c.catchphrase ? '<p class="font-mincho font-bold text-shu text-lg md:text-2xl">' + esc(c.catchphrase) + '</p>' : '') +
        '</section>' +
        '<section class="bg-white kin-frame rounded-md p-[6px] ' + (quick ? 'mb-6' : 'mb-14') + '">' +
          '<div class="h-64 md:h-[26rem] relative rounded-sm overflow-hidden">' + photoHtml(c.photo, c.companyName, '', { eager: true, vt: 'photo', sizes: '(min-width: 1024px) 1000px, 100vw' }) + staffHtml(c, 'lg') + '</div>' +
        '</section>' +
        (quick ? '<div class="quick">' + quick + '</div>' : '') +
        '<section class="mb-16">' + heading('新年のごあいさつ') +
          '<div class="bg-white kin-frame rounded-md overflow-hidden">' +
            '<div class="mx-[6px] mt-[6px] bg-kinari">' + noshiHtml() + '</div>' +
            '<div class="greet px-6 py-8 md:p-12">' +
              (sidePhoto ? '<div class="greet-side">' + sidePhoto + '<p class="greet-sign font-mincho">' + signText + '</p></div>' : '') +
              '<div class="tategaki-box font-mincho font-medium' + (sidePhoto ? ' has-side' : '') + '">' +
                '<p class="greet-lines">' + lines + '</p>' +
                '<p class="greet-sign-in font-mincho">' + signText + '</p>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</section>' +
        (news ? '<section class="mb-16">' + heading('新春のお知らせ') + '<div class="grid grid-cols-1 md:grid-cols-3 gap-6">' + news + '</div></section>' : '') +
        (tables ? '<div class="grid grid-cols-1 md:grid-cols-2 gap-10 mb-16">' + tables + '</div>' : '') +
        (btns ? '<section class="flex flex-col md:flex-row flex-wrap items-stretch justify-center gap-4 w-full max-w-sm md:max-w-none mx-auto mb-16">' + btns + '</section>' : '') +
        nav +
        '<p class="text-center mt-10"><a href="index.html' + (IS_PREVIEW ? '?preview=1' : '') + '" class="back-btn">ごあいさつの一覧へ戻る</a></p>';

      revealOnScroll(page.querySelectorAll('.greet-lines'), 0);
      revealOnScroll(page.querySelectorAll('.news-card'), 120);
    }

    withData(render, { now: true });
  })();
  </script>
</body>
</html>
